server {
  server_name app.umamisushibot.uz;

  root /var/www/umamisushi;
  index index.html;

  # Hashed build assets never change, cache them for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: serve index.html for client-side routes (e.g. /123456789), never cache it
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.umamisushibot.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.umamisushibot.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.umamisushibot.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  server_name app.umamisushibot.uz;
  listen 80;
    return 404; # managed by Certbot


}